<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueStone Billing</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #1E3A8A; /* softer friendly blue */
      height: 60px;
    }

    main {
      flex: 1;
      background-color: #EAF4FB; /* very light soft blue */
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* content starts higher */
      align-items: center;
      text-align: center;
      color: #1E3A8A; /* softer blue for text */
      padding-top: 80px; /* push down a bit */
    }

    h1 {
      font-size: 6rem;
      margin: 30px 0;
      font-weight: bold;
    }

    p {
      font-size: 3rem;
      margin: 15px 0;
    }

    a {
      color: #1E3A8A;
      text-decoration: none;
      font-size: 3rem;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #1E3A8A;
      color: white;
      text-align: center;
      font-size: 1rem;
      padding: 15px;
    }
  </style>
</head>

  <header></header>
  <main>
    <h1>BlueStone Billing</h1>
    <p>718-725-7735</p>
    <p><a href="mailto:info@bluestonebilling.com">info@bluestonebilling.com</a></p>
