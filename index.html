<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueStone Billing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset and basic styling */
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(to bottom, #EAF4FB, #FFFFFF);
      color: #1E3A8A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    header {
      background-color: #1E3A8A;
      height: 60px;
      width: 100%;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 20px 40px 20px; /* reduce top spacing */
      width: 100%;
      max-width: 1200px;
    }

    /* Logo */
    .logo {
      max-width: 900px;      /* large on big screens */
      width: 90%;            /* scales down on small screens */
      height: auto;          
      margin: 20px 0 30px 0; /* less space above and below */
      image-rendering: auto; /* keep PNG crisp */
    }

    /* Contact Section */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;           /* spacing between phone and email */
      padding: 20px 30px;
      width: 100%;
      max-width: 500px;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
    }

    .contact h2 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .contact p, .contact a {
      margin: 0;
      font-weight: 400;
      color: #1E3A8A;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      background-color: #1E3A8A;
      color: white;
      text-align: center;
      font-size: 0.9rem;
      padding: 15px;
      opacity: 0.9;
      width: 100%;
    }

    /* Responsive tweaks for mobile */
    @media (max-width: 600px) {
      .logo {
        margin: 15px 0 20px 0;
      }
      .contact {
        padding: 15px 20px;
        font-size: clamp(1rem, 3vw, 1.4rem);
      }
    }
  </style>
</head>
<body>
  <header></header>
  <main>
    <!-- Logo -->
    <img src="logo.png" alt="BlueStone Billing Logo" class="logo">

    <!-- Contact Section -->
    <div class="contact">
      <h2>Contact Us</h2>
      <p>Phone: 718-725-7735</p>
      <p>Email: <a href="mailto:info@bluestonebilling.com">info@bluestonebilling.com</a></p>
    </div>
  </main>
  <footer>
    © BlueStone Billing 2025. All rights reserved.
  </footer>
</body>
</html>
