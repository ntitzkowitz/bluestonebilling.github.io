<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueStone Billing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset default spacing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(to bottom, #EAF4FB, #FFFFFF);
      color: #1E3A8A;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      background-color: #1E3A8A;
      height: 60px;
      width: 100%;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 20px 20px 20px; /* minimal top spacing */
      width: 100%;
      max-width: 1200px;
    }

    /* Logo */
    .logo {
      max-width: 900px;
      width: 90%;
      height: auto;
      margin: 5px 0; /* minimal spacing above and below */
      image-rendering: auto; /* keeps PNG sharp */
    }

    /* Tagline */
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: #1E3A8A;
      margin: 5px 0 15px 0; /* small spacing below tagline */
      font-weight: 400;
      text-align: center;
    }

    /* Divider */
    .divider {
      width: 60%;
      border-top: 2px solid #1E3A8A;
      margin: 10px 0 20px 0;
      opacity: 0.3; /* subtle and professional */
    }

    /* Contact section */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px; /* spacing between phone and email */
      width: 100%;
      max-width: 500px;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
    }

    .contact h2 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .contact p, .contact a {
      font-weight: 400;
      color: #1E3A8A;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #1E3A8A;
      color: white;
      text-align: center;
      font-size: 0.9rem;
      padding: 15px;
      opacity: 0.9;
      width: 100%;
      margin-top: auto;
    }

    /* Responsive tweaks */
    @media (max-width: 600px) {
      .logo {
        margin: 5px 0 10px 0;
      }
      .tagline {
        font-size: clamp(0.9rem, 3vw, 1.3rem);
        margin-bottom: 10px;
      }
      .divider {
        width: 80%;
        margin: 8px 0 15px 0;
      }
      .contact {
        font-size: clamp(1rem, 3vw, 1.4rem);
      }
    }
  </style>
</head>
<body>
  <header></header>
  <main>
    <!-- Logo -->
    <img src="logo.png" alt="BlueStone Billing Logo" class="logo">

    <!-- Tagline -->

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Contact Section -->
    <div class="contact">
      <h2>Contact Us</h2>
      <p>Phone: 718-725-7735</p>
      <p>Email: <a href="mailto:info@bluestonebilling.com">info@bluestonebilling.com</a></p>
    </div>
  </main>
  <footer>
    © BlueStone Billing 2025. All rights reserved.
  </footer>
</body>

</html>
