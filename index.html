<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueStone Billing</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    header, footer {
      background-color: #00008B; /* dark blue */
      height: 60px;
    }

    main {
      flex: 1;
      background-color: #E6F2FA; /* very light blue */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #00008B;
    }

    h1 {
      font-size: 6rem; /* much bigger */
      margin: 30px 0;
      font-weight: bold;
    }

    p {
      font-size: 3rem; /* bigger contact info */
      margin: 15px 0;
    }

    a {
      color: #00008B;
      text-decoration: none;
      font-size: 3rem;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header></header>
  <main>
    <h1>BlueStone Billing</h1>
    <p>718-725-7735</p>
    <p><a href="mailto:info@bluestonebilling.com">info@bluestonebilling.com</a></p>
  </main>
  <footer></footer>
</body>
</html>
