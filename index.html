<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueStone Billing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Poppins', Arial, sans-serif;
    }

    header {
      background-color: #1E3A8A;
      height: 60px;
    }

    main {
      flex: 1;
      background: linear-gradient(to bottom, #EAF4FB, #FFFFFF);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #1E3A8A;
      padding: 40px 20px;
    }

    /* Logo styles */
    .logo {
      max-width: 900px;      /* big on large screens */
      width: 90%;            /* scales down on smaller screens */
      height: auto;          /* keeps proportions */
      margin: 5px 0 20px 0;  /* top & bottom spacing */
      image-rendering: auto; /* keeps PNG sharp */
    }

    .contact {
      margin-top: 20px;
      background: #ffffffcc;
      padding: 25px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }

    .contact h2 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .contact p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin: 15px 0;
    }

    .contact a {
      color: #1E3A8A;
      text-decoration: none;
      font-size: clamp(1rem, 3vw, 1.5rem);
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      background-color: #1E3A8A;
      color: white;
      text-align: center;
      font-size: 0.9rem;
      padding: 15px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header></header>
  <main>
    <!-- Logo -->
    <img src="logo.png" alt="BlueStone Billing Logo" class="logo">
    
    <div class="contact">
      <h2>Contact Us</h2>
      <p>718-725-7735</p>
      <p><a href="mailto:info@bluestonebilling.com">info@bluestonebilling.com</a></p>
    </div>
  </main>
  <footer>
    © BlueStone Billing 2025. All rights reserved.
  </footer>
</body>
</html>
